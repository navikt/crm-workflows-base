# .github/workflows/mise-tools-update.yml
name: Update mise tools

on:
  workflow_call: # allow this workflow to be called by other workflows
    inputs:
      base-branch:
        description: Base branch to create the pull request against
        required: false
        default: main
        type: string
      branch:
        description: Branch to create for the pull request
        required: false
        default: chore/mise-tools-update
        type: string
      commit-message:
        description: Commit message to use for the update commit
        required: false
        default: "chore(mise): update tool versions"
        type: string
      title:
        description: Title for the pull request
        required: false
        default: "chore(mise): update tool versions"
        type: string
      PLATFORM_TOKEN_APP_ID:
        description: "GitHub App client ID"
        required: true
        type: string
    secrets:
      PLATFORM_TOKEN_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: mise-tools-update-${{ inputs.base-branch }}-${{ inputs.branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Update mise tools
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write permission is required to create a pull request
      pull-requests: write # write permission is required to create a pull request
    steps:
      - name: Validate branches
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_BRANCH"
          git check-ref-format --branch "$BRANCH"

          if [ "$BASE_BRANCH" = "$BRANCH" ]; then
            echo "The update branch must differ from the base branch" >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.PLATFORM_TOKEN_APP_ID }}
          private-key: ${{ secrets.PLATFORM_TOKEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare update branch
        id: prepare-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          existing_pr="$(gh pr list \
            --head "$BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -n "$existing_pr" ]; then
            if [ -z "$remote_branch_sha" ]; then
              echo "Open pull request exists but branch '$BRANCH' does not" >&2
              exit 1
            fi
          fi

          git switch --force-create "$BRANCH" "origin/$BASE_BRANCH"
          echo "remote-branch-sha=$remote_branch_sha" >> "$GITHUB_OUTPUT"
          echo "existing-pr=$existing_pr" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Upgrade tools
        id: upgrade-tools
        run: |
          set +e
          mise upgrade --dry-run-code
          status=$?
          set -e

          case "$status" in
            0)
              echo "upgrade-available=false" >> "$GITHUB_OUTPUT"
              echo "No upgrades available" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              mise upgrade

              if [ -z "$(git status --short -- mise.toml mise.lock)" ]; then
                echo "upgrade-available=false" >> "$GITHUB_OUTPUT"
                echo "mise reported an update but no configuration files changed" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              echo "upgrade-available=true" >> "$GITHUB_OUTPUT"
              echo "Upgrades available" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Commit changes and create Pull Request
        if: steps.upgrade-tools.outputs.upgrade-available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          PREVIOUS_BRANCH_SHA: ${{ steps.prepare-branch.outputs.remote-branch-sha }}
          EXISTING_PR: ${{ steps.prepare-branch.outputs.existing-pr }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_BRANCH_SHA" ]; then
            git push \
              "--force-with-lease=refs/heads/$BRANCH:$PREVIOUS_BRANCH_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          expected_head_oid="$(git rev-parse HEAD)"
          additions="$(jq -n --arg path mise.toml --rawfile contents mise.toml \
            '[{path: $path, contents: ($contents | @base64)}]')"
          deletions='[]'

          if [ -f mise.lock ]; then
            additions="$(jq --arg path mise.lock --rawfile contents mise.lock \
              '. + [{path: $path, contents: ($contents | @base64)}]' <<< "$additions")"
          elif git cat-file -e HEAD:mise.lock 2>/dev/null; then
            deletions='[{"path":"mise.lock"}]'
          fi

          jq -n \
            --arg query 'mutation($repository: String!, $branch: String!, $expectedHeadOid: GitObjectID!, $message: String!, $additions: [FileAddition!]!, $deletions: [FileDeletion!]!) { createCommitOnBranch(input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $expectedHeadOid, message: {headline: $message}, fileChanges: {additions: $additions, deletions: $deletions}}) { commit { oid url } } }' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg expectedHeadOid "$expected_head_oid" \
            --arg message "$COMMIT_MESSAGE" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            '{query: $query, variables: {repository: $repository, branch: $branch, expectedHeadOid: $expectedHeadOid, message: $message, additions: $additions, deletions: $deletions}}' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "Automated update of tools declared in \`mise.toml\`.\nReview the changes and merge when ready." \
              --base "$BASE_BRANCH" \
              --head "$BRANCH"
          else
            echo "Updated existing PR: $EXISTING_PR"
          fi
