name: "Validate"
on:
  workflow_call:
    inputs:
      pool-tag:
        description: The tag of the pool to validate against
        required: true
        type: string
        default: test-ci
      run-all-validations:
        description: Run all validations and scan the full workspace instead of only detected changes
        required: false
        type: boolean
        default: false
    secrets:
      DEV_HUB_SFDX_URL:
        required: true
      PACKAGE_KEY:
        required: false
      NODE_AUTH_TOKEN:
        required: false
permissions: {}
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read access to repository contents
    outputs:
      code: ${{ steps.detect-changes.outputs.code }}
      metadata: ${{ steps.detect-changes.outputs.metadata }}
      code_files: ${{ steps.detect-changes.outputs.code_files }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Detect changes
        id: detect-changes
        uses: navikt/sf-gha-detect-changes@a24ab9ad8f27c0c479a4f8a992ed02283ab88d21

  validate-project:
    name: Validate Project
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read access to repository contents

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # otherwise, you will failed to push refs to dest repo

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: |
          pnpm install --frozen-lockfile
          pnpm prettier . --check
  salesforce-code-validation:
    name: Salesforce Code Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: inputs.run-all-validations || needs.detect-changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write # Required for uploading SARIF results to GitHub Security tab
      pull-requests: write # Used to create a review of the pull request
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # otherwise, you will failed to push refs to dest repo

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Prepare Salesforce Code Analyzer workspace
        id: prepare-code-analyzer
        env:
          RUN_ALL_VALIDATIONS: ${{ inputs.run-all-validations }}
          CODE_FILES: ${{ needs.detect-changes.outputs.code_files }}
        run: |
          set -euo pipefail

          quote_argument() {
            local value="$1" quoted='"' char i
            for ((i = 0; i < ${#value}; i++)); do
              char="${value:i:1}"
              case "$char" in
                '\') quoted+='"\"' ;;
                '"') quoted+='\"' ;;
                *) quoted+="$char" ;;
              esac
            done
            printf '%s"' "$quoted"
          }

          files=()
          if [[ "$RUN_ALL_VALIDATIONS" == "true" ]]; then
            files=(".")
          else
            while IFS= read -r file || [[ -n "$file" ]]; do
              [[ -z "$file" ]] && continue
              if [[ -f "$file" ]]; then
                files+=("$file")
              else
                printf 'Skipping removed or non-file path: %s\n' "$file"
              fi
            done <<< "$CODE_FILES"
          fi

          workspace_arguments=()
          for file in "${files[@]}"; do
            workspace_arguments+=("--workspace" "$(quote_argument "$file")")
          done

          has_files=false
          if (( ${#files[@]} > 0 )); then
            has_files=true
          else
            echo "::notice::No existing changed code files to analyze; skipping Code Analyzer."
          fi

          {
            printf 'workspace-arguments=%s\n' "${workspace_arguments[*]}"
            printf 'has-files=%s\n' "$has_files"
          } >> "$GITHUB_OUTPUT"

      - name: Install Salesforce Code Analyzer Plugin
        if: steps.prepare-code-analyzer.outputs.has-files == 'true'
        run: sf plugins install code-analyzer@latest

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        if: steps.prepare-code-analyzer.outputs.has-files == 'true'
        uses: forcedotcom/run-code-analyzer@318e7429b49b97904dc41f7acbd41003db403965
        with:
          run-arguments: ${{ steps.prepare-code-analyzer.outputs.workspace-arguments }} --view detail --output-file sfca_results.html --output-file sfca_results.json --output-file code-analyzer-report.sarif
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || '' }}

      # Code Analyser generates an empty SARIF file if no violations are found.
      # In that case this step ensures that the SARIF file is valid and contains a default structure.
      # This is required for the SARIF file to be uploaded to GitHub.
      - name: Check SARIF file
        if: steps.run-code-analyzer.outcome == 'success'
        run: |
          echo "::group::Print SARIF file before check"
          cat code-analyzer-report.sarif
          echo "::endgroup::"
          echo "::group::Check SARIF file"
          jq --arg wd "$GITHUB_WORKSPACE" '
            if .runs == [] then
              .runs = [
                {
                  "tool": {
                    "driver": {
                      "name": "flow",
                      "rules": []
                    }
                  },
                  "results": [],
                  "invocations": [
                    {
                      "executionSuccessful": true,
                      "workingDirectory": {
                        "uri": $wd
                      }
                    }
                  ]
                },
                {
                  "tool": {
                    "driver": {
                      "name": "pmd",
                      "rules": []
                    }
                  },
                  "results": [],
                  "invocations": [
                    {
                      "executionSuccessful": true,
                      "workingDirectory": {
                        "uri": $wd
                      }
                    }
                  ]
                }
              ]
            else
              .
            end
          ' code-analyzer-report.sarif > temp.sarif && mv temp.sarif code-analyzer-report.sarif
          echo "::endgroup::"
          echo "::group::Print SARIF file after check"
          cat code-analyzer-report.sarif
          echo "::endgroup::"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@7e3036b9cd87fc26dd06747b7aa4b96c27aaef3a
        if: ${{ steps.run-code-analyzer.outcome == 'success' && github.ref_name == github.event.repository.default_branch }}
        with:
          sarif_file: code-analyzer-report.sarif
          category: salesforce-code-analyzer

      - name: Check the Salesforce Code Analyzer outputs to determine whether to fail
        if: ${{ steps.run-code-analyzer.outputs.exit-code > 0 || steps.run-code-analyzer.outputs.num-sev1-violations > 0 || steps.run-code-analyzer.outputs.num-violations > 10 }}
        shell: bash
        run: |
          set -euo pipefail

          # Normalize (default to 0 if unset/empty)
          EXIT_CODE=${EXIT_CODE:-0}
            NUM_SEV1_VIOLATIONS=${NUM_SEV1_VIOLATIONS:-0}
            NUM_SEV2_VIOLATIONS=${NUM_SEV2_VIOLATIONS:-0}
            NUM_SEV3_VIOLATIONS=${NUM_SEV3_VIOLATIONS:-0}
            NUM_SEV4_VIOLATIONS=${NUM_SEV4_VIOLATIONS:-0}
            NUM_SEV5_VIOLATIONS=${NUM_SEV5_VIOLATIONS:-0}
            NUM_VIOLATIONS=${NUM_VIOLATIONS:-0}

          # Exclude Sev5 (Info) from total count threshold
          totalViolations=$(( NUM_VIOLATIONS - NUM_SEV5_VIOLATIONS ))

          if (( EXIT_CODE > 0 )); then
            echo "::error title=Salesforce Code Analyzer failed::Exit code: ${EXIT_CODE}"
          fi

          if (( NUM_SEV1_VIOLATIONS > 0 )) || (( totalViolations > MAX_ALLOWED_VIOLATIONS )); then
            
          printf -v details \
            "Number of Sev1 Critical violations: %s\n \
            Number of Sev2 High violations: %s\n \
            Number of Sev3 Medium violations: %s\n \
            Number of Sev4 Low violations: %s\n \
            Number of Sev5 Info violations: %s\n \
            Total (excluding Sev5): %s (max %s)" \
            "$NUM_SEV1_VIOLATIONS" "$NUM_SEV2_VIOLATIONS" "$NUM_SEV3_VIOLATIONS" "$NUM_SEV4_VIOLATIONS" "$NUM_SEV5_VIOLATIONS" "$totalViolations" "$MAX_ALLOWED_VIOLATIONS"
            
            # GitHub command: replace literal newlines with %0A
            echo "::error title=Salesforce Code Analyzer threshold exceeded::${details//$'\n'/%0A}"
          fi

          if (( EXIT_CODE > 0 )) || (( NUM_SEV1_VIOLATIONS > 0 )) || (( totalViolations > MAX_ALLOWED_VIOLATIONS )); then
            exit 1
          fi
        env:
          MAX_ALLOWED_VIOLATIONS: 10
          EXIT_CODE: ${{ steps.run-code-analyzer.outputs.exit-code }}
          NUM_SEV1_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-sev1-violations }}
          NUM_SEV2_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-sev2-violations }}
          NUM_SEV3_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-sev3-violations }}
          NUM_SEV4_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-sev4-violations }}
          NUM_SEV5_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-sev5-violations }}
          NUM_VIOLATIONS: ${{ steps.run-code-analyzer.outputs.num-violations }}

  validate-against-pool:
    name: Validate against pool
    needs: detect-changes
    if: inputs.run-all-validations || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read access to repository contents
      packages: read # Read access to packages (needed for installing the sf cli pool plugin)
    env:
      DEV_HUB_ALIAS: devhub
      SCRATCH_ORG_ALIAS: ciScratch
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # otherwise, you will failed to push refs to dest repo

      - name: Delete unpackagable
        run: |
          rm -rf **/unpackagable
          rm -rf **/unpackagable-with-auto-deploy
          rm -rf **/scratch-org

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Install pool plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set @navikt:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          mkdir -p "$HOME/.config/sf"
          printf '%s\n' '["@navikt/sf-cli-plugin-pool"]' > "$HOME/.config/sf/unsignedPluginAllowList.json"  
          sf plugins install @navikt/sf-cli-plugin-pool@latest

      # Authenticate dev hub
      - name: Authenticate Dev Hub
        id: authenticate-dev-hub
        uses: navikt/sf-gha-authenticateOrg@bb934753f101b4e30086e42c8e7db642ffe05b07
        with:
          auth-url: ${{ secrets.DEV_HUB_SFDX_URL }}
          alias: ${{ env.DEV_HUB_ALIAS }}
          set-default-username: false
          set-default-devhub-username: true

      - name: Fetch from pool
        id: fetch-from-pool
        run: |
          echo "Fetching from pool..."
          sf pool fetch --alias "$SCRATCH_ORG_ALIAS" --set-default --pool-tag $POOL_TAG --target-dev-hub $DEV_HUB_ALIAS
        env:
          POOL_TAG: ${{ inputs.pool-tag }}

      - id: test-run
        uses: navikt/sf-gha-run-tests@6c3f09222f39a88253ae18e9c01a7e2b997beb0a
        with:
          target-org: ${{env.SCRATCH_ORG_ALIAS}}
          required-code-coverage: 85

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #7.0.2
        with:
          name: salesforce-test-results
          path: test-run/
          if-no-files-found: ignore

      - name: Verify test results
        id: verify-test-results
        run: |
          if [ "$IS_TEST_SUCCESS" != "true" ]; then
            echo "Tests failed"
            exit 1
          fi

          if [ "$IS_CODE_COVERED" != "true" ]; then
            echo "Code coverage requirement not met"
            exit 1
          fi
        env:
          IS_TEST_SUCCESS: ${{ steps.test-run.outputs.is-test-success }}
          IS_CODE_COVERED: ${{ steps.test-run.outputs.is-code-covered }}

      - name: Cleanup
        if: always() && steps.authenticate-dev-hub.outcome == 'success' && steps.fetch-from-pool.outcome == 'success'
        run: sf org delete scratch --target-org "$SCRATCH_ORG_ALIAS" --no-prompt

      - name: Set PR to draft if Scratch org validation failed
        if: always() && github.event.pull_request && (steps.test-run.outcome == 'failure' || steps.verify-test-results == 'failure')
        run: |
          echo "Setting PR to draft due to failed validation"
          gh pr edit ${{ github.event.pull_request.number }} --draft
        env:
          VALIDATION_RESULT: ${{ steps.test-run.outcome }}
          VERIFY_TEST_RESULTS: ${{ steps.verify-test-results.outputs.is-test-success }}
